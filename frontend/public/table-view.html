<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Tables</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar settings -->
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="search.html">Search</a>
            <a href="collection.html">My Collection</a>
        </div>
    </div>
    <!-- Will show the data in the Database in two seperate tables -->
    <h1>Database Tables</h1>
    <div id="tables-container">
        <div id="user-data">
            <!-- Id, email, password -->
            <h2>User Data</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Password</th>
                    </tr>
                </thead>
                <tbody id="user-data-body"></tbody>
            </table>
        </div>
        <div id="collection-data">
            <!-- user id, card id, card name, card image -->
            <h2>Collection Data</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User ID</th>
                        <th>Card ID</th>
                        <th>Card Name</th>
                        <th>Card Image</th>
                    </tr>
                </thead>
                <tbody id="collection-data-body"></tbody>
            </table>
        </div>
    </div>
    <script src="/js/navbar.js"></script>
    <script src="/js/table-view.js"></script>
</body>
</html>
